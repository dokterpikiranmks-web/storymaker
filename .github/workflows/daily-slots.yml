name: Dual-Scheduler Daily Slots 24h (Dokter Pikiran)

on:
  schedule:
    # Slot 1 (07:00 WITA): cron '0 23 * * *' (23:00 UTC) -> Story 1 (Hook Pagi)
    - cron: '0 23 * * *'
    # Slot 2 (07:45 WITA): cron '45 23 * * *' (23:45 UTC) -> Story 2 (Edukasi Skema)
    - cron: '45 23 * * *'
    # Slot 3 (13:00 WITA): cron '0 5 * * *' (05:00 UTC) -> Story 3 (Praktik Siang)
    - cron: '0 5 * * *'
    # Slot 4 (20:00 WITA): cron '0 12 * * *' (12:00 UTC) -> Story 4 (Kasus Terapi Malam)
    - cron: '0 12 * * *'
    # Slot 5 (21:00 WITA): cron '0 13 * * *' (13:00 UTC) -> Story 5 (Refleksi & PDF)
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Nomor Slot (1 - 5, auto) atau kosongkan untuk deteksi otomatis jam WITA'
        required: false
        default: 'auto'
      mode:
        description: 'Mode Pengiriman (single / all)'
        required: false
        default: 'single'
      secret:
        description: 'Secret Token (Default: DOKTERPIKIRAN2026)'
        required: false
        default: 'DOKTERPIKIRAN2026'

jobs:
  dispatch-slot:
    name: Dispatch Real-Time WA Story Slot
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Real-time Slot Dispatcher Endpoint
        run: |
          BASE_URL="${{ secrets.APP_URL || 'https://storymaker-jet.vercel.app' }}"
          SLOT="${{ github.event.inputs.slot || 'auto' }}"
          MODE="${{ github.event.inputs.mode || 'single' }}"
          SECRET="${{ github.event.inputs.secret || secrets.CRON_SECRET || 'DOKTERPIKIRAN2026' }}"
          
          # Bersihkan trailing slash
          CLEAN_URL="${BASE_URL%/}"
          
          TARGET_URL="$CLEAN_URL/api/cron/slot-dispatcher"
          PARAMS="?secret=$SECRET"
          
          if [ "$MODE" = "all" ]; then
            PARAMS="${PARAMS}&mode=all"
          elif [ -n "$SLOT" ]; then
            PARAMS="${PARAMS}&slot=$SLOT"
          fi
          
          FINAL_URL="${TARGET_URL}${PARAMS}"
          echo "🚀 Memicu Endpoint: $FINAL_URL"
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "$FINAL_URL")
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
          
          echo "Hasil Respon (Status $HTTP_STATUS):"
          echo "$HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Gagal memicu slot dispatcher (HTTP $HTTP_STATUS)"
            exit 1
          fi
          
          echo "✅ Slot berhasil diproses dan dikirim ke Telegram!"
